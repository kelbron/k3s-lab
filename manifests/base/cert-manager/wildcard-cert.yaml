apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls-cert
  namespace: default
spec:
  # Initial baseline defaults; overwritten dynamically by Kustomize replacements from homelab-globals
  commonName: "DOMAIN"
  dnsNames:
    - "DOMAIN"
    - "*.DOMAIN"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  secretName: wildcard-tls-secret
