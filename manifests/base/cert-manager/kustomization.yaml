apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../globals
  - wildcard-cert.yaml
  - cluster-issuer.yaml
  - desec-external-secret.yaml

replacements:
  - source:
      kind: ConfigMap
      name: homelab-globals
      fieldPath: data.DOMAIN
    targets:
      - select:
          kind: Certificate
          name: wildcard-tls-cert
        fieldPaths:
          - spec.commonName
          - spec.dnsNames.0
      - select:
          kind: Certificate
          name: wildcard-tls-cert
        fieldPaths:
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 1

  - source:
      kind: ConfigMap
      name: homelab-globals
      fieldPath: data.ACME_EMAIL
    targets:
      - select:
          kind: ClusterIssuer
          name: letsencrypt-production
        fieldPaths:
          - spec.acme.email
