apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-external
  namespace: default
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vaultwarden-external
  namespace: default
subsets:
  - addresses:
      # The static IP of KC02 where Docker is running
      - ip: 192.168.1.51
    ports:
      - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: ""
spec:
  tls:
    - hosts:
        - "vault.DOMAIN"
      secretName: wildcard-tls-secret
  rules:
    - host: "vault.DOMAIN"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden-external
                port:
                  number: 8080
